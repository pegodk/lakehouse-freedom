# Curated platform capability comparison. This is broader than the capabilities
# exercised by the v1 workload, but is not intended to enumerate every product
# feature. Keep profile and target versions explicit so the comparison can be
# reproduced and reviewed as the products evolve.
#
# status:
#   NATIVE        substantially equivalent capability in the open target
#   ALTERNATIVE   same outcome through a different open component or approach
#   WORKAROUND    outcome is possible with material limitations or manual work
#   MISSING       no implemented equivalent in this repository's open stack
#   NOT_ASSESSED  insufficient evidence; excluded from both ratios

as_of: 2026-10-04

profiles:
  - key: table_format
    component: Table format and transactions
    source: Databricks Delta Lake
    target: Delta Lake OSS 4.3.1
    features:
      - {capability: ACID transaction log, area: Core format, status: NATIVE, workload: required, evidence: measured:freedom_day}
      - {capability: Schema enforcement and evolution, area: Core format, status: NATIVE, workload: required, evidence: measured:schema}
      - {capability: Time travel and table history, area: Core format, status: NATIVE, workload: not_used, evidence: documented}
      - {capability: MERGE / UPDATE / DELETE, area: DML, status: NATIVE, workload: required, evidence: measured:scd2}
      - {capability: Change Data Feed, area: DML, status: NATIVE, workload: not_used, evidence: documented}
      - {capability: Deletion vectors, area: Advanced format, status: NATIVE, workload: not_used, evidence: documented}
      - {capability: Row tracking, area: Advanced format, status: NATIVE, workload: not_used, evidence: documented}
      - {capability: Liquid clustering, area: Layout, status: MISSING, workload: not_used, evidence: documented, gap: Databricks-managed clustering is not available in this stack.}
      - {capability: Predictive optimization, area: Maintenance, status: ALTERNATIVE, workload: not_used, evidence: documented, alternative: Scheduled OPTIMIZE and VACUUM jobs.}
      - {capability: Catalog-managed coordinated commits, area: Transactions, status: MISSING, workload: not_used, evidence: documented, gap: Open reads are validated for external Delta tables; catalog-managed commit parity is not claimed.}

  - key: batch_compute
    component: Batch compute
    source: Databricks Runtime and serverless compute
    target: Apache Spark 4.1.0 standalone
    features:
      - {capability: Spark SQL and DataFrame execution, area: Runtime, status: NATIVE, workload: required, evidence: measured:spark_executable}
      - {capability: PySpark and Spark Connect, area: Runtime, status: NATIVE, workload: required, evidence: measured:spark_executable}
      - {capability: Delta Lake integration, area: Runtime, status: NATIVE, workload: required, evidence: measured:freedom_day}
      - {capability: Cluster libraries and custom code, area: Runtime, status: NATIVE, workload: required, evidence: measured:transformations}
      - {capability: Autoscaling workers, area: Elasticity, status: WORKAROUND, workload: not_used, evidence: documented, gap: Requires an external cluster manager; the tested stack has fixed workers.}
      - {capability: Serverless provisioning, area: Operations, status: MISSING, workload: not_used, evidence: documented, gap: Compute must be provisioned and operated by the user.}
      - {capability: Photon vectorized engine, area: Performance, status: MISSING, workload: not_used, evidence: documented, gap: Photon is proprietary; Spark uses its OSS execution engine.}
      - {capability: Runtime-managed upgrades and patching, area: Operations, status: MISSING, workload: not_used, evidence: documented, gap: Image and dependency lifecycle belongs to the operator.}
      - {capability: Spot/preemptible instance orchestration, area: Elasticity, status: ALTERNATIVE, workload: not_used, evidence: documented, alternative: Cloud or Kubernetes cluster-manager configuration.}
      - {capability: Managed compute policies, area: Governance, status: WORKAROUND, workload: not_used, evidence: documented, gap: Must be implemented with infrastructure policy and deployment controls.}

  - key: sql_analytics
    component: SQL analytics
    source: Databricks SQL
    target: Spark SQL and DuckDB
    features:
      - {capability: ANSI SQL query execution, area: Query, status: NATIVE, workload: required, evidence: measured:tpch_results}
      - {capability: Delta table queries, area: Query, status: NATIVE, workload: required, evidence: measured:tpch_results}
      - {capability: JDBC/ODBC connectivity, area: Connectivity, status: ALTERNATIVE, workload: not_used, evidence: documented, alternative: Spark Thrift Server or a compatible query service.}
      - {capability: Multi-engine local analytics, area: Query, status: ALTERNATIVE, workload: required, evidence: measured:duckdb_access, alternative: DuckDB reads the same Delta storage.}
      - {capability: Serverless SQL warehouses, area: Operations, status: MISSING, workload: not_used, evidence: documented, gap: No managed serverless warehouse is included.}
      - {capability: Warehouse autoscaling and auto-stop, area: Operations, status: WORKAROUND, workload: not_used, evidence: documented, gap: Requires deployment-level automation.}
      - {capability: Result cache and managed query acceleration, area: Performance, status: WORKAROUND, workload: not_used, evidence: documented, gap: Engine caches differ and are not managed as a single service.}
      - {capability: Query history and profiles, area: Observability, status: ALTERNATIVE, workload: not_used, evidence: documented, alternative: Spark event logs and engine-specific profiling.}
      - {capability: SQL alerts and scheduled queries, area: Automation, status: ALTERNATIVE, workload: not_used, evidence: documented, alternative: Airflow scheduling and alert integrations.}
      - {capability: Integrated dashboards, area: BI, status: MISSING, workload: not_used, evidence: documented, gap: An external BI tool is required.}

  - key: streaming_ingestion
    component: Streaming and file ingestion
    source: Auto Loader and Databricks Structured Streaming
    target: Apache Spark Structured Streaming and Kafka
    features:
      - {capability: Micro-batch streaming, area: Processing, status: NATIVE, workload: not_used, evidence: planned:challenge-2}
      - {capability: Exactly-once checkpointed processing, area: Processing, status: NATIVE, workload: not_used, evidence: documented}
      - {capability: Kafka source and sink, area: Connectivity, status: NATIVE, workload: not_used, evidence: documented}
      - {capability: File source ingestion, area: Files, status: NATIVE, workload: not_used, evidence: planned:challenge-2}
      - {capability: Incremental file discovery at cloud scale, area: Files, status: WORKAROUND, workload: not_used, evidence: planned:challenge-2, gap: OSS file listing does not reproduce Auto Loader notification and discovery behavior.}
      - {capability: Managed schema inference and schema location, area: Schema, status: WORKAROUND, workload: not_used, evidence: planned:challenge-2, gap: Requires explicit schema state and evolution handling.}
      - {capability: Rescued data column for unexpected input, area: Schema, status: ALTERNATIVE, workload: not_used, evidence: planned:challenge-2, alternative: Parse permissively and retain corrupt or unknown fields explicitly.}
      - {capability: Managed file notification setup, area: Operations, status: MISSING, workload: not_used, evidence: documented, gap: Cloud queues events and permissions must be provisioned separately.}
      - {capability: Auto Loader backfill controls, area: Operations, status: WORKAROUND, workload: not_used, evidence: planned:challenge-2, gap: Requires custom discovery state or batch backfill orchestration.}
      - {capability: Integrated streaming operational UI, area: Observability, status: ALTERNATIVE, workload: not_used, evidence: documented, alternative: Spark UI metrics and external monitoring.}

  - key: catalog_governance
    component: Catalog and governance
    source: Databricks managed Unity Catalog
    target: Unity Catalog OSS 0.5.0
    features:
      - {capability: Catalog and schema hierarchy, area: Metadata, status: NATIVE, workload: required, evidence: measured:catalog_probe.namespaces}
      - {capability: External Delta table registration, area: Metadata, status: NATIVE, workload: required, evidence: measured:catalog_probe.external_table}
      - {capability: Volumes, area: Metadata, status: NATIVE, workload: required, evidence: measured:catalog_probe.volume}
      - {capability: REST catalog API, area: Interoperability, status: NATIVE, workload: required, evidence: measured:catalog_probe.rest_registration}
      - {capability: Iceberg REST interoperability, area: Interoperability, status: NATIVE, workload: not_used, evidence: documented}
      - {capability: Storage credentials and credential vending, area: Storage, status: WORKAROUND, workload: required, evidence: measured:duckdb_access, gap: Vended credentials omit the custom S3 endpoint used by SeaweedFS.}
      - {capability: Object privileges and grants, area: Authorization, status: WORKAROUND, workload: not_used, evidence: measured:catalog_probe.grants, gap: Supported by UC OSS but disabled in the tested stack and requires identity integration.}
      - {capability: Enterprise identity federation, area: Identity, status: WORKAROUND, workload: not_used, evidence: documented, gap: OAuth/OIDC integration must be configured and operated.}
      - {capability: Governed tags, area: Governance, status: MISSING, workload: not_used, evidence: documented, gap: No equivalent governed tag control plane is implemented.}
      - {capability: Tag-driven ABAC policies, area: Authorization, status: MISSING, workload: not_used, evidence: documented, gap: Requires a policy service plus catalog and engine integration.}
      - {capability: Row filters, area: Fine-grained access, status: MISSING, workload: not_used, evidence: documented, gap: UC OSS grants do not inject row predicates into every query engine.}
      - {capability: Column masks, area: Fine-grained access, status: MISSING, workload: not_used, evidence: documented, gap: UC OSS grants do not rewrite protected columns in every query engine.}
      - {capability: Dynamic views for security, area: Fine-grained access, status: ALTERNATIVE, workload: not_used, evidence: documented, alternative: Engine views with carefully controlled base-table and storage access.}
      - {capability: Workspace bindings, area: Isolation, status: MISSING, workload: not_used, evidence: documented, gap: The OSS server has no Databricks workspace boundary.}
      - {capability: Automatic lineage, area: Observability, status: ALTERNATIVE, workload: not_used, evidence: planned:challenge-8, alternative: OpenLineage with a compatible backend.}
      - {capability: Audit and system tables, area: Observability, status: WORKAROUND, workload: not_used, evidence: planned:challenge-8, gap: Logs must be collected and normalized separately.}
      - {capability: Catalog search and discovery UI, area: Discovery, status: WORKAROUND, workload: not_used, evidence: documented, gap: UC OSS UI is less complete than the managed governance experience.}
      - {capability: Lakehouse federation, area: Federation, status: MISSING, workload: not_used, evidence: documented, gap: Cross-system query federation is not supplied by UC OSS.}

