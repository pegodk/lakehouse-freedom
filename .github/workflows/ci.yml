name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv -p 3.12 .venv && uv pip install --python .venv/bin/python -e '.[local,dev]'
      - run: .venv/bin/ruff check src tpch benchmarks portability platforms tests --exclude platforms/openlakehouse/stack
      - run: .venv/bin/python -m pytest -m "not stack"
      - name: docs build
        run: uv pip install --python .venv/bin/python 'zensical==0.0.67' && .venv/bin/zensical build --clean
