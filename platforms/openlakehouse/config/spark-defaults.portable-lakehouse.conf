# Portable Lakehouse overrides, appended to OpenLakehouse's
# config/spark/spark-defaults.conf.example by scripts/configure.sh.
# Later keys win, so anything set here replaces the upstream value.

# A Spark catalog named `portable_lakehouse` backed by the Unity Catalog OSS
# catalog of the same name. Using the same catalog name keeps three-level table
# names consistent across the two reference implementations.
spark.sql.catalog.portable_lakehouse                 io.unitycatalog.spark.UCSingleCatalog
spark.sql.catalog.portable_lakehouse.uri             http://unity-catalog:8080
spark.sql.catalog.portable_lakehouse.token           not_used

# Laptop sizing: one executor using most of the worker. The upstream default
# (2 cores x 8g) leaves six of eight cores idle on a 16 GB machine.
spark.driver.memory                       ${PORTABLE_LAKEHOUSE_SPARK_DRIVER_MEMORY}
spark.executor.memory                     ${PORTABLE_LAKEHOUSE_SPARK_EXECUTOR_MEMORY}
spark.executor.cores                      ${PORTABLE_LAKEHOUSE_SPARK_EXECUTOR_CORES}
spark.sql.shuffle.partitions              ${PORTABLE_LAKEHOUSE_SPARK_SHUFFLE_PARTITIONS}
spark.sql.adaptive.enabled                true
