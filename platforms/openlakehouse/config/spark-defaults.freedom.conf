# Lakehouse Freedom overrides, appended to OpenLakehouse's
# config/spark/spark-defaults.conf.example by scripts/configure.sh.
# Later keys win, so anything set here replaces the upstream value.

# A Spark catalog named `freedom` backed by the Unity Catalog OSS catalog of the
# same name. Databricks uses a Unity Catalog catalog called `freedom` too, so
# three-level names (freedom.tpch_sf1.lineitem) are identical on both platforms.
spark.sql.catalog.freedom                 io.unitycatalog.spark.UCSingleCatalog
spark.sql.catalog.freedom.uri             http://unity-catalog:8080
spark.sql.catalog.freedom.token           not_used

# Laptop sizing: one executor using most of the worker. The upstream default
# (2 cores x 8g) leaves six of eight cores idle on a 16 GB machine.
spark.driver.memory                       ${FREEDOM_SPARK_DRIVER_MEMORY}
spark.executor.memory                     ${FREEDOM_SPARK_EXECUTOR_MEMORY}
spark.executor.cores                      ${FREEDOM_SPARK_EXECUTOR_CORES}
spark.sql.shuffle.partitions              ${FREEDOM_SPARK_SHUFFLE_PARTITIONS}
spark.sql.adaptive.enabled                true
