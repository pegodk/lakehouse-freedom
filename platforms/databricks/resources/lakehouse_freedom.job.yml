# Databricks Workflows definition of the shared pipeline graph
# (src/common/pipeline.py). tests/portability/test_orchestration.py checks that
# task keys and dependencies here match that graph exactly.
resources:
  jobs:
    lakehouse_freedom:
      name: lakehouse-freedom-sf${var.scale_factor}
      max_concurrent_runs: 1
      environments:
        - environment_key: freedom
          spec:
            environment_version: "4"
            dependencies:
              - ../../../dist/*.whl
      tasks:
        - task_key: generate
          environment_key: freedom
          spark_python_task:
            python_file: ../entrypoint.py
            parameters: [generate, --scale, "${var.scale_factor}", --catalog, "${var.catalog}",
                         --table-root, "${var.table_root}", --repeats, "${var.repeats}",
                         --volume-root, "/Volumes/${var.catalog}/landing"]
        - task_key: bronze
          depends_on: [{task_key: generate}]
          environment_key: freedom
          spark_python_task:
            python_file: ../entrypoint.py
            parameters: [bronze, --scale, "${var.scale_factor}", --catalog, "${var.catalog}",
                         --table-root, "${var.table_root}", --repeats, "${var.repeats}",
                         --volume-root, "/Volumes/${var.catalog}/landing"]
        - task_key: silver
          depends_on: [{task_key: bronze}]
          environment_key: freedom
          spark_python_task:
            python_file: ../entrypoint.py
            parameters: [silver, --scale, "${var.scale_factor}", --catalog, "${var.catalog}",
                         --table-root, "${var.table_root}", --repeats, "${var.repeats}",
                         --volume-root, "/Volumes/${var.catalog}/landing"]
        - task_key: gold
          depends_on: [{task_key: silver}]
          environment_key: freedom
          spark_python_task:
            python_file: ../entrypoint.py
            parameters: [gold, --scale, "${var.scale_factor}", --catalog, "${var.catalog}",
                         --table-root, "${var.table_root}", --repeats, "${var.repeats}",
                         --volume-root, "/Volumes/${var.catalog}/landing"]
        - task_key: quality
          depends_on: [{task_key: gold}]
          environment_key: freedom
          spark_python_task:
            python_file: ../entrypoint.py
            parameters: [quality, --scale, "${var.scale_factor}", --catalog, "${var.catalog}",
                         --table-root, "${var.table_root}", --repeats, "${var.repeats}",
                         --volume-root, "/Volumes/${var.catalog}/landing"]
        - task_key: incremental
          environment_key: freedom
          spark_python_task:
            python_file: ../entrypoint.py
            parameters: [incremental, --scale, "${var.scale_factor}", --catalog, "${var.catalog}",
                         --table-root, "${var.table_root}", --repeats, "${var.repeats}",
                         --volume-root, "/Volumes/${var.catalog}/landing"]
        - task_key: tpch_queries
          depends_on: [{task_key: quality}]
          environment_key: freedom
          spark_python_task:
            python_file: ../entrypoint.py
            parameters: [tpch_queries, --scale, "${var.scale_factor}", --catalog, "${var.catalog}",
                         --table-root, "${var.table_root}", --repeats, "${var.repeats}",
                         --volume-root, "/Volumes/${var.catalog}/landing"]
