[project]
name = "portable-lakehouse"
version = "0.1.0"
description = "An evidence-based comparison of Databricks and OpenLakehouse feature parity."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
# Runtime dependencies are deliberately minimal: this wheel is installed on
# Databricks serverless, where pyspark is provided by the platform.
dependencies = [
    "duckdb==1.5.6",
    "pyyaml>=6",
]

[project.optional-dependencies]
# The OpenLakehouse implementation and portability tooling run on a developer machine.
local = [
    "pyspark-client==4.1.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "datafusion>=50,<55",
    "deltalake>=1.2,<2",
    "boto3>=1.35",
    "requests>=2.32",
]
databricks = [
    "databricks-sdk>=0.40",
]
ml = [
    "mlflow>=3.14,<4",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
docs = [
    "zensical==0.0.67",
]

[project.scripts]
portable-lakehouse = "portability.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

# The repository keeps the layout from the Portable Lakehouse spec (src/, tpch/,
# benchmarks/runner/, portability/) and maps it onto importable packages:
#   portable_lakehouse            <- src/              shared workload code
#   portable_lakehouse.tpch       <- tpch/             generator, queries, expected answers
#   portable_lakehouse.benchmarks <- benchmarks/runner/ query runner (runs on both platforms)
#   portability                  <- portability/        assessment, validation, reporting
#   portable_lakehouse_platforms <- platforms/          platform adapters (entry points, sessions)
[tool.setuptools]
package-dir = { "portable_lakehouse" = "src", "portable_lakehouse.tpch" = "tpch", "portable_lakehouse.benchmarks" = "benchmarks/runner", "portability" = "portability", "portable_lakehouse_platforms" = "platforms" }
packages = [
    "portable_lakehouse",
    "portable_lakehouse.common",
    "portable_lakehouse.ingestion",
    "portable_lakehouse.transformations",
    "portable_lakehouse.quality",
    "portable_lakehouse.governance",
    "portable_lakehouse.ml",
    "portable_lakehouse.tpch",
    "portable_lakehouse.tpch.generator",
    "portable_lakehouse.benchmarks",
    "portability",
    "portability.assessment",
    "portability.validation",
    "portability.reporting",
    "portable_lakehouse_platforms",
    "portable_lakehouse_platforms.openlakehouse",
    "portable_lakehouse_platforms.databricks",
]

[tool.setuptools.package-data]
"portable_lakehouse.tpch" = ["queries/*.sql", "queries/adapted/*/*.sql", "expected/*/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "stack: needs the local OpenLakehouse stack running (make openlakehouse-up)",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Broad excepts are deliberate in the validation code: a failure is recorded as
# a measurement instead of aborting the run.
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP017"]

[tool.ruff.lint.isort]
known-first-party = ["portable_lakehouse", "portability", "portable_lakehouse_platforms"]
