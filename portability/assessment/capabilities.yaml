# Capability mapping: Databricks capability used (or commonly used) by a
# workload like this one -> OpenLakehouse equivalent.
#
# classification: PORTABLE | ADAPTABLE | REIMPLEMENT | PLATFORM-SPECIFIC
#   PORTABLE           ran unchanged on OpenLakehouse in the measured scenario
#   ADAPTABLE          small, mechanical change (configuration, an idiom swap)
#   REIMPLEMENT        the requirement remains, but the implementation changes substantially
#   PLATFORM-SPECIFIC  managed capability with no drop-in OSS equivalent here
#
# evidence: `measured:<source>` is checked on every run (Portability Check, catalog
# probe, benchmark); `documented` is a reasoned statement that
# this repository does not test automatically.

- capability: Table format
  databricks: Delta Lake (Databricks Runtime)
  openlakehouse: Delta Lake 4.3.1 (delta-spark), delta-kernel-rs (DuckDB)
  classification: PORTABLE
  evidence: measured:delta_readable
  notes: The OpenLakehouse implementation reads the workload's external Delta tables through Unity Catalog OSS.

- capability: Batch compute
  databricks: Apache Spark on serverless or classic compute (Photon optional)
  openlakehouse: Apache Spark 4.1.0 standalone, clients via Spark Connect
  classification: PORTABLE
  evidence: measured:spark_executable
  notes: Same PySpark code; only session creation differs (entrypoint.py).

- capability: SQL analytics
  databricks: Databricks SQL / Spark SQL
  openlakehouse: Spark SQL; DuckDB for single-node analytics
  classification: PORTABLE
  evidence: measured:tpch_results

- capability: DataFrame transformations
  databricks: PySpark DataFrame API
  openlakehouse: PySpark DataFrame API over Spark Connect
  classification: PORTABLE
  evidence: measured:transformations

- capability: Incremental upserts / SCD2
  databricks: Delta MERGE INTO
  openlakehouse: Delta MERGE INTO (OSS Delta)
  classification: PORTABLE
  evidence: measured:scd2

- capability: Full refresh of an external table
  databricks: CREATE OR REPLACE TABLE ... LOCATION ... AS SELECT
  openlakehouse: create once, then INSERT OVERWRITE
  classification: ADAPTABLE
  evidence: measured:delta_io
  notes: The UC OSS 0.5 Spark connector rejects CREATE OR REPLACE with a location. The INSERT OVERWRITE idiom works on both platforms and is what the shared code uses.

- capability: Table and column metadata changes
  databricks: ALTER TABLE ... SET TBLPROPERTIES / COMMENT
  openlakehouse: set comments and properties at creation time
  classification: ADAPTABLE
  evidence: measured:catalog_probe.alter_metadata

- capability: Catalog (namespaces, external tables, volumes)
  databricks: Unity Catalog
  openlakehouse: Unity Catalog OSS 0.5.0
  classification: ADAPTABLE
  evidence: measured:catalog_probe
  notes: Catalogs, schemas, external Delta tables, comments and volumes recreate. Column metadata and custom properties of Spark-created tables are not stored by UC OSS; registering through the REST API keeps them.

- capability: Access control
  databricks: Unity Catalog grants, row filters, column masks
  openlakehouse: UC OSS permissions require server.authorization=enable plus an identity provider
  classification: PLATFORM-SPECIFIC
  evidence: measured:catalog_probe.grants
  notes: OpenLakehouse ships with authorization disabled; grants are not stored. Portability Challenge #4.

- capability: Non-Spark engine access through the catalog
  databricks: credential vending to DuckDB, Trino, ... (UC external access)
  openlakehouse: UC OSS resolves the location; DuckDB reads with its own S3 secret
  classification: ADAPTABLE
  evidence: measured:duckdb_access
  notes: UC OSS vends credentials without an S3 endpoint, so DuckDB's unity_catalog extension sends requests to AWS instead of SeaweedFS. Location lookup through the catalog plus delta_scan works.

- capability: Raw file landing
  databricks: Unity Catalog Volumes (/Volumes FUSE path)
  openlakehouse: S3 prefix on SeaweedFS (UC OSS volumes exist as metadata)
  classification: ADAPTABLE
  evidence: measured:spark_executable
  notes: The path is configuration (LakehouseConfig.raw_root); the generator handles both.

- capability: Orchestration
  databricks: Lakeflow Jobs (Workflows) defined in an Asset Bundle
  openlakehouse: Apache Airflow 3.1.6 DAG generated from the same task graph
  classification: ADAPTABLE
  evidence: measured:orchestration
  notes: The task graph is shared; each scheduler definition is platform code. The Airflow DAG is checked for consistency but not executed in v1.

- capability: Deployment
  databricks: Databricks Asset Bundles
  openlakehouse: Docker Compose (OpenLakehouse) plus scripts in platforms/openlakehouse
  classification: PLATFORM-SPECIFIC
  evidence: documented

- capability: Elastic, managed compute
  databricks: Serverless compute, autoscaling, Photon
  openlakehouse: Fixed-size Spark standalone cluster you operate
  classification: PLATFORM-SPECIFIC
  evidence: documented
  notes: Principle F6. This is where the managed platform earns its keep; the benchmark section shows the effect when comparable compute is used.

- capability: Table maintenance
  databricks: Predictive optimization, auto compaction
  openlakehouse: Scheduled OPTIMIZE / VACUUM (supported by OSS Delta)
  classification: ADAPTABLE
  evidence: documented

- capability: Lineage, audit and system tables
  databricks: Unity Catalog lineage, system tables
  openlakehouse: OpenLineage (not part of v1)
  classification: PLATFORM-SPECIFIC
  evidence: documented
  notes: Portability Challenge #8.
